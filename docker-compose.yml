version: "3.8"

services:
  portal-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-console
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - portal_data:/app/data
    environment:
      - DATA_DIR=/app/data
      # Panel Giriş Bilgileri (Varsayılan: admin / admin123)
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      # Opsiyonel: Sağlayıcı API Bilgileri (Arayüzden de girilebilir)
      - CLICKSEND_USERNAME=
      - CLICKSEND_API_KEY=
      - DEFAULT_DOMAIN=
      - DEFAULT_SENDER_ID=

volumes:
  portal_data:
    name: portal_data
